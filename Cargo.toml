[package]
name = "argo"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.9.2"
ark-ff = "0.5.0"
ark-ec = "0.5.0"
ark-std = { version = "0.5.0", features = [ "getrandom" ]}
ark-bn254 = "0.5.0"
ark-serialize = "0.5.0"
lazy_static = "1.5.0"
blake3 = { version = "1.8.2", features = [ "traits-preview" ]}
aes = "0.8.4"
once_cell = "1.21.3"
derive_more = { version = "2.1.0", features = [ "from", "deref" ]}
num-bigint = "0.4.6"
serde = "1.0.228"

[dev-dependencies]
criterion = "0.7.0"

[profile.release]
opt-level = 3
incremental = true
panic = 'abort'

[profile.test-release]
inherits = "release"
opt-level = 1
lto = "thin"

[profile.bench]
inherits = "release"
debug = false
rpath = false
incremental = true
debug-assertions = false

[[bench]]
name = "groth16_verifier"
harness = false
